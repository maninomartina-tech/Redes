# Publicación de la app en Netlify.
#
# Acá va solo la app (el sitio). El servidor que publica en Instagram no puede
# vivir en Netlify: necesita un proceso siempre encendido y disco que persista.
# Ver server/README.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # Dirección del servidor propio.
  #
  # Va acá y no en el panel de Netlify a propósito: así queda a la vista, viaja
  # con el proyecto y no depende de encontrar un menú. No es un secreto —es una
  # dirección pública, y el servidor pide usuario y contraseña igual—, así que
  # no hay nada que esconder.
  #
  # Se lee al compilar, no al abrir la página: si cambia, hay que volver a
  # desplegar para que tenga efecto.
  VITE_API_URL = "https://demm-server.onrender.com"

# La app usa rutas con # así que no hace falta reescribir nada, pero esto deja
# cubierto cualquier acceso directo a una ruta.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de seguridad razonables para un panel privado.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los archivos con hash en el nombre no cambian nunca: se pueden cachear fuerte.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
