# Configuración lista para Render.
#
# Con este archivo no hay que armar el servicio a mano: en Render se elige
# "New → Blueprint", se apunta a este repositorio y queda todo creado —el
# servicio, el disco y las variables— pidiendo solo los valores secretos.
#
# La dirección pública no hace falta cargarla: el servidor la toma sola de
# RENDER_EXTERNAL_URL, que Render define al desplegar (ver src/config.js).

services:
  - type: web
    name: demm-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    region: oregon

    # Plan pago más chico, y no es un capricho: el gratuito de Render no
    # admite disco, y sin disco la base de datos se borra en cada despliegue.
    # Ahí adentro está toda la planificación —clientes, contenido, crecimiento,
    # ventas y los links de cada cliente—, así que un cambio menor en la app
    # dejaría el panel en blanco.
    plan: starter

    # Render reinicia el servicio si esta ruta deja de responder.
    healthCheckPath: /api/salud

    # Acá viven la base de datos y las piezas subidas. Es lo que hace que la
    # planificación sobreviva a los despliegues.
    disk:
      name: datos
      mountPath: /datos
      sizeGB: 1

    envVars:
      # Los que Render va a pedir al crear el servicio.
      #
      # El usuario y la contraseña con los que entrás al panel. Sin la
      # contraseña, el espacio de trabajo no se puede usar desde ningún lado.
      - key: USUARIO_CREADORA
        sync: false
      - key: CLAVE_CREADORA
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      # Dirección de la app en Netlify, para permitirle hablar con el servidor.
      - key: APP_ORIGIN
        sync: false

      # Opcionales: se pueden dejar vacíos y cargar después.
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Solo lectura: trae el feed y las métricas, no publica.
      # Empezar así evita el trámite de aprobación de Meta para publicar.
      # Cuando quieras la publicación automática, poné false.
      - key: MODO_SOLO_LECTURA
        value: true

      # Valores fijos.
      - key: META_API_VERSION
        value: v21.0
      - key: MAX_ATRASO_HORAS
        value: 6
      - key: NODE_ENV
        value: production
